<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="DF.css">
</head>
<body>
    <div class="card">
        <h2>Student Admission Form</h2>
        <div class="Form">
            <form>
                <label for="Name"><b>Full Name</b></label>
                <br>
                <input type="text" id="Name" name="fullName" placeholder="Enter your full name" required>
                <br><br>

                <label for="Email"><b>Email</b></label>
                <br>
                <input type="email" id="Email" name="email" placeholder="Enter your email" required>
                <br><br>

                <label for="Password"><b>Admission Password</b></label>
                <br>
                <input type="password" id="Password" name="password" placeholder="Create a password" required>
                <br><br>

                <label for="Age"><b>Age</b></label>
                <br>
                <input type="number" id="Age" name="age" placeholder="Enter your age" required>
                <br><br>

                <label for="dob"><b>Date of Birth</b></label>
                <br>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <label for="Time"><b>Preferred Interview Time</b></label>
                <br>
                <input type="time" id="time" name="time" required>
                <br><br>

                <b>Gender</b>
                <br>
                <div class="gender">
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                    
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </div>
                <br><br>

                <label for="course"><b>Select Course</b></label>
                <br>
                <select id="course" name="course" required>
                    <option value="" disabled selected>Select a course</option>
                    <option value="btech">B.Tech CSE</option>
                    <option value="bca">BCA</option>
                    <option value="mca">MCA</option>
                    <option value="bba">BBA</option>
                </select>
                <br><br>

                <label for="address"><b>Address</b></label>
                <br>
                <textarea id="address" name="address" rows="3" placeholder="Enter your complete address" required></textarea>
                <br><br>

                <b>Skills</b>
                <br>
                <div class="Skills">
                <input type="checkbox" id="html" name="skills" value="html">
                <label for="html">HTML</label>
                
                <input type="checkbox" id="css" name="skills" value="css">
                <label for="css">CSS</label>
                
                <input type="checkbox" id="js" name="skills" value="javascript">
                <label for="js">JavaScript</label>
                
                <input type="checkbox" id="react" name="skills" value="react">
                <label for="react">React</label>
                <br><br>
                </div>
                <label for="photo"><b>Upload Student Photo</b></label>
                <br>
                <input type="file" id="photo" name="photo" accept="image/*">
                <br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label>
                <br><br>

                <button type="submit">Submit Application</button>
            </form>
        </div>

        <p class="total-item"><span id="itemCount"></span></p>
        <div class="mainContainer"></div>
    </div>
    <script src="DF.js"></script>
</body>
</html>
