<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager</title>
    <link rel="stylesheet" href="NT.css">
</head>
<body>
    <div class="card">
        <h2>Note Taking App</h2>
        <form>
            <input type="text" id="Note" placeholder="Enter Note Title" required>
            <br>
            <br>
            <input type="text" id="description" placeholder="Enter Note description" required>
           <br>
           <br>
           <button type="submit" class="addbtn">Add Note</button>
           <p class="TotalNotes">Total Notes :</p>
        </form>
        
      
        <div class="mainContainer"></div>
        
    </div>
    <script src="NT.js"></script>
</body>
</html>
