<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List Manager</title>
    <link rel="stylesheet" href="shop.css">
</head>
<body>
    <div class="card">
        <h2>Shopping List Manager</h2>
        <form>
            <input type="text" id="itemName" placeholder="Item Name" required>
            <input type="text" id="itemQty" placeholder="Quantity" required>
            <button type="submit" class="addbtn">Add Item</button>
        </form>
        <p class="total-item">Total Items : <span id="itemCount">0</span></p>
        <div class="mainContainer"></div>
    </div>
    <script src="shop.js"></script>
</body>
</html>
